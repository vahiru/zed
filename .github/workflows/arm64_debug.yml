name: arm64_debug
on:
  workflow_dispatch:

jobs:
  bundle_windows_aarch64:
    name: Build Windows ARM64 (.exe)
    runs-on: windows-2022
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Enable Long Paths
        run: |
          git config --global core.longpaths true
          New-ItemProperty -Path "HKLM:\System\CurrentControlSet\Control\FileSystem" `
            -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: powershell

      - name: Build Bundled ARM64 Binary
        run: |
          # 显式清除 CI 变量以跳过正式发布的签名和变量检查
          $env:CI = $null
          
          # 缩短 Cargo 路径以防止 Windows 路径过长错误
          $env:CARGO_HOME = "C:\c"
          if (!(Test-Path $env:CARGO_HOME)) { New-Item -Path $env:CARGO_HOME -ItemType Directory }
          
          # 强制设置工作目录为字符串路径
          $env:ZED_WORKSPACE = (Get-Location).Path
          Write-Output "Workspace: $env:ZED_WORKSPACE"
          
          # 预先拉取依赖
          Write-Output "Fetching dependencies..."
          cargo fetch
          
          # 运行打包脚本
          .\script\bundle-windows.ps1 -Architecture aarch64
        shell: pwsh

      - name: Upload Zed-aarch64 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Zed-aarch64-debug
          path: target/Zed-aarch64.exe
          if-no-files-found: warn
